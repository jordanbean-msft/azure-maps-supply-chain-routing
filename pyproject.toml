[project]
name = "supply-chain-routing"
version = "0.1.0"
description = "Azure Maps supply-chain lane planning demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "azure-core[aio]>=1.41.0",
  "azure-cosmos>=4.17.1",
  "azure-identity>=1.27.0",
  "azure-monitor-opentelemetry>=1.8.12",
  "fastapi[standard]",
  "httpx>=0.28.1",
  "ortools>=9.15.6755",
  "pydantic-settings",
  "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "httpx",
  "ruff",
  "mypy",
  "bandit",
  "pip-audit",
  "pre-commit",
]

[project.scripts]
supply-chain-routing = "template_repository.main:main"
template-repository = "template_repository.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["template_repository"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/template_repository"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv]
package = true
prerelease = "if-necessary-or-explicit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_repository"]
