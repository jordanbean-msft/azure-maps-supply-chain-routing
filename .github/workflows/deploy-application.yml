name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      azd_env_name:
        description: Existing provisioned azd environment
        required: true
        default: demo

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-${{ inputs.azd_env_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed application
    runs-on: ubuntu-latest
    environment: ${{ inputs.azd_env_name }}
    env:
      AZURE_ENV_NAME: ${{ inputs.azd_env_name }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Authenticate azd with GitHub OIDC
        run: |
          azd auth login --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
      - name: Restore environment from deployed resources
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env refresh --no-prompt
      - name: Build and deploy containers
        run: azd deploy --no-prompt
      - name: Verify the deployed demo
        run: |
          web_uri="$(azd env get-value SERVICE_WEB_URI)"
          bash scripts/smoke-api.sh "$web_uri"
